
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorPop Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #845ec2, #00c9a7);
      min-height: 100vh;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: rgba(255, 255, 255, 0.15);
    }

    nav h2 {
      font-size: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: clamp(36px, 6vw, 60px);
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    button {
      background: #ffde59;
      color: #333;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      background: #ffffff;
    }

    .cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 20px;
      width: 250px;
      text-align: center;
      box-shadow: 0 8px 20px #33333320;
    }

    .card h2 {
      margin-bottom: 12px;
    }

    footer {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

  <nav>
    <h2>ColorPop ✨</h2>
    <div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </div>
  </nav>

  <section class="hero" id="home">
    <h1>Make Your World Colorful!</h1>
    <p>Welcome to my beautiful and creative website.</p>
    <button onclick="showMessage()">Explore Now 🎉</button>
  </section>

  <section class="cards" id="about">
    <div class="card">
      <h2>🎨 Creative</h2>
      <p>Turn your amazing ideas into reality.</p>
    </div>

    <div class="card">
      <h2>🌈 Colourful</h2>
      <p>Enjoy a bright and beautiful design.</p>
    </div>

    <div class="card">
      <h2>🚀 Modern</h2>
      <p>Simple, responsive and easy to use.</p>
    </div>
  </section>

  <footer>
    <p>Made with ❤️ using HTML, CSS and JavaScript</p>
  </footer>

  <script>
    function showMessage() {
      alert("Welcome to ColorPop! 🌈");
    }
  </script>

</body>
</html>
